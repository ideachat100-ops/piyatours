<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piya Tours - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <div class="header-content">
                <img src="LOGO.jpg" alt="Logo" class="admin-logo">
                <h1>Piya Tours Admin</h1>
            </div>
            <a href="index.html" class="back-link">Back to Site</a>
        </header>

        <div class="admin-grid">
            <!-- Left Column: Upload & Reviews -->
            <div class="admin-sidebar-col" style="display: flex; flex-direction: column; gap: 30px;">
                <!-- Upload Section -->
                <section class="card upload-section">
                    <h2>Upload New Photo</h2>
                    <form id="uploadForm">
                        <div class="form-group">
                            <label for="photoFile">Select Photo</label>
                            <input type="file" id="photoFile" accept="image/*" required>
                            <div id="imagePreview" class="image-preview"></div>
                        </div>
                        <div class="form-group">
                            <label for="labelEn">English Description (Optional)</label>
                            <input type="text" id="labelEn" placeholder="e.g. Safari at Yala">
                        </div>
                        <div class="form-group">
                            <label for="labelRu">Russian Description (Optional)</label>
                            <input type="text" id="labelRu" placeholder="e.g. Сафари в Яле">
                        </div>
                        <button type="submit" id="uploadBtn" class="btn btn-primary">Upload Photo</button>
                        <div id="uploadStatus" class="status-msg"></div>
                    </form>
                </section>

                <!-- Reviews Management Section -->
                <section class="card reviews-section-admin">
                    <h2>Manage Reviews</h2>
                    <p class="subtitle">Moderate user-submitted reviews</p>
                    <div id="loadingReviews" class="loading">Loading reviews...</div>
                    <div class="admin-reviews-list" id="adminReviewsList">
                        <!-- Reviews will be rendered here via JS -->
                    </div>
                </section>
            </div>

            <!-- Right Column: Gallery Section -->
            <section class="card gallery-section">
                <h2>Manage Photos</h2>
                <p class="subtitle">Photos uploaded via Firebase</p>
                <div id="loadingPhotos" class="loading">Loading photos...</div>
                <div class="admin-gallery-grid" id="adminGalleryGrid">
                    <!-- Photos will be rendered here via JS -->
                </div>
            </section>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    
    <!-- Main script to access GALLERY_PHOTOS -->
    <script src="script.js"></script>
    
    <!-- Admin logic -->
    <script src="admin.js?v=3"></script>
</body>
</html>
